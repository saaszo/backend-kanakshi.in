<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0e11"/>
      <stop offset="50%" stop-color="#161419"/>
      <stop offset="100%" stop-color="#0b0a0d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa8214"/>
      <stop offset="100%" stop-color="#e5c158"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="50%" stop-color="#e9718b"/>
      <stop offset="100%" stop-color="#b83253"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Outer & Inner Luxury Borders -->
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#2e2720" stroke-width="1.5" />
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.6" />

  <!-- Corner Diamonds -->
  <polygon points="36,28 44,36 36,44 28,36" fill="#d4af37" />
  <polygon points="1164,28 1172,36 1164,44 1156,36" fill="#d4af37" />
  <polygon points="36,586 44,594 36,602 28,594" fill="#d4af37" />
  <polygon points="1164,586 1172,594 1164,602 1156,594" fill="#d4af37" />

  <!-- Brand Center Logo / Sparkling Diamond -->
  <g transform="translate(600, 140)">
    <!-- Aura glow -->
    <circle cx="0" cy="0" r="70" fill="#e9718b" opacity="0.12" filter="url(#glow)" />
    
    <!-- Diamond Gem -->
    <polygon points="0,-48 48,-6 0,48 -48,-6" fill="url(#roseGrad)" stroke="#ffd1dc" stroke-width="2" />
    <polygon points="0,-36 34,-6 0,36 -34,-6" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="1.2" />
    <polygon points="0,-20 18,-6 0,20 -18,-6" fill="#ffffff" />
    <polygon points="0,-10 9,-6 0,10 -9,-6" fill="#d4af37" />

    <!-- Sparkle rays -->
    <line x1="0" y1="-62" x2="0" y2="-52" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="52" x2="0" y2="62" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <line x1="-62" y1="-6" x2="-52" y2="-6" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="-6" x2="62" y2="-6" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Brand Title -->
  <text x="600" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="8">KANAKSHI</text>

  <!-- Subtitle -->
  <text x="600" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="url(#goldGrad)" letter-spacing="12">FINE JEWELLERY</text>

  <!-- Divider with center diamond -->
  <line x1="440" y1="360" x2="570" y2="360" stroke="#e9718b" stroke-width="1.5" stroke-opacity="0.8"/>
  <polygon points="600,354 606,360 600,366 594,360" fill="#ffffff" />
  <line x1="630" y1="360" x2="760" y2="360" stroke="#e9718b" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Tagline -->
  <text x="600" y="405" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="24" fill="#e8e4df">Everyday Luxury in 925 Pure Silver &amp; Certified Lab Diamonds</text>

  <!-- Trust Badges -->
  <g transform="translate(600, 485)">
    <!-- Badge 1 -->
    <g transform="translate(-390, 0)">
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#1b191e" stroke="#4a3e35" stroke-width="1"/>
      <text x="90" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e2d4be">✦ 100% BIS Hallmarked</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(-195, 0)">
      <rect x="0" y="0" width="185" height="42" rx="21" fill="#1b191e" stroke="#4a3e35" stroke-width="1"/>
      <text x="92" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e2d4be">✦ Anti-Tarnish Rhodium</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="185" height="42" rx="21" fill="#1b191e" stroke="#4a3e35" stroke-width="1"/>
      <text x="92" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e2d4be">✦ 7-Day Easy Returns</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(205, 0)">
      <rect x="0" y="0" width="185" height="42" rx="21" fill="#1b191e" stroke="#4a3e35" stroke-width="1"/>
      <text x="92" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e2d4be">✦ Free Insured Delivery</text>
    </g>
  </g>

  <!-- URL -->
  <text x="600" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#8c857b" letter-spacing="2">WWW.KANAKSHI.IN</text>
</svg>
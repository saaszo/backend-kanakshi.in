<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="kanakshiGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F3" />
      <stop offset="50%" stop-color="#FDF8E2" />
      <stop offset="100%" stop-color="#E9718B" />
    </linearGradient>
    <filter id="softGlowWhite" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Diamond Facet Icon -->
  <g transform="translate(15, 12)">
    <polygon points="28,2 52,22 28,54 4,22" fill="none" stroke="url(#kanakshiGoldLight)" stroke-width="2.2" stroke-linejoin="round" />
    <polygon points="18,12 38,12 48,22 28,44 8,22" fill="none" stroke="#FFF0F3" stroke-width="1.2" stroke-opacity="0.85" />
    <line x1="18" y1="12" x2="28" y2="2" stroke="url(#kanakshiGoldLight)" stroke-width="1.2" />
    <line x1="38" y1="12" x2="28" y2="2" stroke="url(#kanakshiGoldLight)" stroke-width="1.2" />
    <line x1="28" y1="12" x2="28" y2="44" stroke="url(#kanakshiGoldLight)" stroke-width="1.4" />
    <line x1="8" y1="22" x2="48" y2="22" stroke="url(#kanakshiGoldLight)" stroke-width="1.2" />
    <g transform="translate(28, 22) scale(0.65)" filter="url(#softGlowWhite)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FDF8E2" />
      <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Brand Typography (Light for dark footer/hero backgrounds) -->
  <g transform="translate(90, 42)">
    <text font-family=""Cormorant Garamond", Georgia, "Times New Roman", serif" font-size="34" font-weight="700" letter-spacing="4.5" fill="#FFFFFF">KANAKSHI</text>
    <text y="22" font-family=""Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif" font-size="10.5" font-weight="600" letter-spacing="5.5" fill="#E9718B">FINE JEWELLERY</text>
  </g>
</svg>

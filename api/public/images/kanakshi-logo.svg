<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 54" width="100%" height="100%">
  <defs>
    <linearGradient id="kanakshiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9718B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B83253" />
    </linearGradient>
  </defs>

  <!-- Diamond Facet Icon -->
  <g transform="translate(6, 6)">
    <!-- Outer Diamond Contour -->
    <polygon points="21,2 39,17 21,41 3,17" fill="none" stroke="url(#kanakshiGold)" stroke-width="2" stroke-linejoin="round" />
    <!-- Table & Star Facets -->
    <polygon points="13,9 29,9 36,17 21,33 6,17" fill="none" stroke="#E9718B" stroke-width="1" stroke-opacity="0.85" />
    <line x1="13" y1="9" x2="21" y2="2" stroke="url(#kanakshiGold)" stroke-width="1" />
    <line x1="29" y1="9" x2="21" y2="2" stroke="url(#kanakshiGold)" stroke-width="1" />
    <line x1="21" y1="9" x2="21" y2="33" stroke="url(#kanakshiGold)" stroke-width="1.2" />
    <line x1="6" y1="17" x2="36" y2="17" stroke="url(#kanakshiGold)" stroke-width="1" />
    <!-- Center Sparkle -->
    <g transform="translate(21, 17) scale(0.55)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#D4AF37" />
      <circle cx="0" cy="0" r="1.5" fill="#FFF0F3" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(56, 31)">
    <text font-family="Georgia, serif" font-size="26" font-weight="700" letter-spacing="3.5" fill="#1A1A1A">KANAKSHI</text>
    <text y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="8.5" font-weight="700" letter-spacing="4" fill="#E9718B">FINE JEWELLERY</text>
  </g>
</svg>

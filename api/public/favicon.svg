<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9718B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B83253" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#0D0D0D" />
    </radialGradient>
  </defs>

  <!-- Dark Luxury Rounded Square Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="url(#favGold)" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Center Diamond Contour & Facets -->
  <g transform="translate(32, 32)">
    <!-- Outer Contour -->
    <polygon points="0,-22 20,-4 0,22 -20,-4" fill="none" stroke="url(#favGold)" stroke-width="2.4" stroke-linejoin="round" />
    <!-- Inner Table & Side Facets -->
    <polygon points="-10,-12 10,-12 16,-4 0,14 -16,-4" fill="none" stroke="#E9718B" stroke-width="1.2" stroke-opacity="0.9" />
    <line x1="-10" y1="-12" x2="0" y2="-22" stroke="url(#favGold)" stroke-width="1.2" />
    <line x1="10" y1="-12" x2="0" y2="-22" stroke="url(#favGold)" stroke-width="1.2" />
    <line x1="0" y1="-12" x2="0" y2="14" stroke="url(#favGold)" stroke-width="1.4" />
    <line x1="-16" y1="-4" x2="16" y2="-4" stroke="url(#favGold)" stroke-width="1.2" />

    <!-- Center Radiant Sparkle -->
    <g transform="translate(0, -4) scale(0.65)">
      <polygon points="0,-14 3,-4 14,0 3,4 0,14 -3,4 -14,0 -3,-4" fill="#D4AF37" />
      <circle cx="0" cy="0" r="1.8" fill="#FFF0F3" />
    </g>
  </g>
</svg>
